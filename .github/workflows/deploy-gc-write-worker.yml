name: Deploy GC write worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/process-gc-write-jobs/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-gc-write-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-gc-write-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mgiebypxhnmpktljrzjq
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Require Supabase deployment credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in this repository."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy process-gc-write-jobs
        run: >-
          supabase functions deploy process-gc-write-jobs
          --project-ref "$SUPABASE_PROJECT_REF"
          --use-api
